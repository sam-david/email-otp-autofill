<!doctype html>
<html>
<head><meta charset="utf-8"><title>OTP widgets</title>
<style>body{font:15px system-ui;padding:40px} .boxes input,.otp-box{width:36px;height:40px;text-align:center;font-size:20px;margin-right:6px;border:1px solid #999;display:inline-flex;align-items:center;justify-content:center}</style>
</head>
<body>
<!-- content.js against real OTP widget libraries, with a fake worker that delivers 604318.
     ?w=inputotp   input-otp 1.4.1 (shadcn/ui's OTP field: one transparent input over slots)
     ?w=reactotp   react-otp-input 3.1.1 (React-controlled box per digit)
     ?w=vanilla    plain boxes with auto-advance that ignore paste (forces per-box typing)
     ?w=nomax      boxes with no maxlength, first one marked one-time-code (seen on real sites)
     Writes data-result = { dom, state } — `state` is what the app itself received. -->
<p>Enter the verification code we emailed you</p>
<div id="root"></div>
<script>
  window.__state = '';
  window.chrome = { runtime: {
    onMessage: { addListener() {} },
    connect() {
      const listeners = [];
      return {
        onMessage: { addListener: (f) => listeners.push(f) }, onDisconnect: { addListener() {} }, disconnect() {},
        postMessage(m) {
          if (m.type !== 'start') return;
          setTimeout(() => listeners.forEach((f) => f({ type: 'candidate', code: '604318', sender: 'Stripe', senderDomain: 'stripe.com',
            match: 'strong', receivedAt: Date.now() - 4000, autoFill: true, autoSubmit: false })), 600);
        },
      };
    },
  } };
</script>
<script type="module">
  const w = new URLSearchParams(location.search).get('w') || 'vanilla';
  const root = document.getElementById('root');
  if (w === 'nomax') {
    root.innerHTML = '<div class="boxes"><input autocomplete="one-time-code" inputmode="numeric">' + '<input inputmode="numeric">'.repeat(5) + '</div>';
    const boxes = [...root.querySelectorAll('input')];
    boxes.forEach((b) => b.addEventListener('input', () => { window.__state = boxes.map((x) => x.value).join(''); }));
  } else if (w === 'vanilla') {
    root.innerHTML = '<div class="boxes">' + '<input maxlength="1" inputmode="numeric">'.repeat(6) + '</div>';
    const boxes = [...root.querySelectorAll('input')];
    boxes.forEach((b, i) => {
      b.addEventListener('paste', (e) => e.preventDefault()); // widget that refuses paste
      b.addEventListener('input', () => {
        b.value = b.value.replace(/\D/g, '').slice(-1);
        if (b.value && boxes[i + 1]) boxes[i + 1].focus();
        window.__state = boxes.map((x) => x.value).join('');
      });
    });
  } else {
    const React = (await import('https://esm.sh/react@18.3.1')).default;
    const { createRoot } = await import('https://esm.sh/react-dom@18.3.1/client');
    const h = React.createElement;
    let App;
    if (w === 'reactotp') {
      const OtpInput = (await import('https://esm.sh/react-otp-input@3.1.1?deps=react@18.3.1,react-dom@18.3.1')).default;
      App = () => {
        const [v, setV] = React.useState('');
        window.__state = v;
        return h(OtpInput, { value: v, onChange: setV, numInputs: 6, inputType: 'tel', renderInput: (p) => h('input', p) });
      };
    } else {
      const { OTPInput } = await import('https://esm.sh/input-otp@1.4.1?deps=react@18.3.1,react-dom@18.3.1');
      App = () => {
        const [v, setV] = React.useState('');
        window.__state = v;
        return h(OTPInput, { maxLength: 6, value: v, onChange: setV,
          render: ({ slots }) => h('div', { style: { display: 'flex' } }, slots.map((s, i) => h('div', { key: i, className: 'otp-box' }, s.char))) });
      };
    }
    createRoot(root).render(h(App));
  }
  const s = document.createElement('script'); s.src = '../content.js'; document.body.appendChild(s);
  setTimeout(() => document.body.setAttribute('data-result', JSON.stringify({
    w, dom: [...root.querySelectorAll('input')].map((i) => i.value), state: window.__state,
    chip: !!document.querySelector('email-code-autofill'),
  })), 3500);
</script>
</body>
</html>
