<!doctype html>
<html>
<head><meta charset="utf-8"><title>Verify your email (test site)</title>
<style>body{font:16px system-ui;max-width:420px;margin:80px auto;padding:0 16px} input{font-size:22px;letter-spacing:6px;width:180px;padding:8px} button{font-size:16px;padding:8px 14px} #done{color:#16a34a;font-weight:600}</style></head>
<body>
  <!-- Live test target for the extension: open, then email yourself "Your verification code is 123456". -->
  <h2>Check your inbox</h2>
  <p>We've sent a 6-digit verification code to your email. Enter it below.</p>
  <form onsubmit="event.preventDefault(); document.getElementById('done').textContent = 'Submitted code ' + this.otp.value;">
    <input name="otp" autocomplete="one-time-code" inputmode="numeric" maxlength="6" autofocus>
    <button>Verify</button>
  </form>
  <p id="done"></p>
</body>
</html>
